apiVersion: v2
appVersion: v2.1.0
dependencies:
- condition: k8s-nim-operator.enabled
  name: k8s-nim-operator
  repository: https://helm.ngc.nvidia.com/nvidia
  version: v2.0.0
- condition: frontend.enabled
  name: frontend
  repository: ""
  version: v2.1.0
- condition: zipkin.enabled
  name: zipkin
  repository: https://zipkin.io/zipkin-helm
  version: 0.1.2
- condition: opentelemetry-collector.enabled
  name: opentelemetry-collector
  repository: https://open-telemetry.github.io/opentelemetry-helm-charts
  version: 0.78.1
- condition: kube-prometheus-stack.enabled
  name: kube-prometheus-stack
  repository: https://prometheus-community.github.io/helm-charts
  version: 69.7.2
description: An end to end Helm chart for the NVIDIA RAG Blueprint
name: nvidia-rag-blueprint
type: application
version: v2.1.0
